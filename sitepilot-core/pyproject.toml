[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sitepilot-core"
version = "0.1.0"
description = "Local-first SitePilot MCP server for WordPress site status"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "keyring==25.7.0",
    "certifi==2026.10.23",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "anyio==4.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
